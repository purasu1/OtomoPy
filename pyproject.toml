[project]
name = "otomopy"
version = "1.0.0"
dependencies = [
    "discord.py >= 2.0.0",
    "python-dotenv >= 0.19.0",
    "aiohttp >= 3.8.0",
]
requires-python = ">=3.12"
description = "Holodex relay bot for Discord"
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
deepl = [
    "deepl >= 1.22.0",
]
dev = [
    "pytest >= 8",
]

[project.scripts]
otomopy = "otomopy.bot:main"

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.basedpyright]
include = ["src", "tests"]
exclude = ["build", ".venv", "**/__pycache__"]
pythonVersion = "3.12"
typeCheckingMode = "recommended"

# Everything else stays at "recommended". These are off deliberately:
reportAny = false  # Holodex/Discord payloads are untyped JSON at the boundary
reportExplicitAny = false  # ...so dict[str, Any] is the honest annotation for them
reportUnusedCallResult = false  # would need `_ =` on every add_field()/followup.send()
reportImplicitStringConcatenation = false  # black emits this when wrapping long f-strings

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "LOG", "RUF"]
ignore = [
    "E203",  # whitespace before ':' -- disagrees with black, as in .flake8
    # Discord-facing strings deliberately use symbols like "\u2139" and "\u25c0".
    "RUF001",
    "RUF002",
    "RUF003",
]
